name: FSRS release watch
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fsrs-release-watch
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
      - run: node scripts/check-fsrs-release.mjs probe fsrs-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fsrs-watch-result
          path: fsrs-result.json
          if-no-files-found: error
          retention-days: 7
  notify:
    needs: probe
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      # A fresh runner: upstream crate build scripts cannot modify this job's policy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsrs-watch-result
          path: watch-result
      - run: node scripts/check-fsrs-release.mjs notify watch-result/fsrs-result.json
        env:
          GH_TOKEN: ${{ github.token }}
