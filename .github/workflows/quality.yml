name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  quality:
    name: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum pnpm verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-runtime-evidence
          path: |
            target/playwright-report/
            target/playwright-results/**/axe-*.json
          if-no-files-found: ignore
          retention-days: 7
  native-windows:
    name: native-windows
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: windows-tests
      - run: cargo test --workspace --locked
      - run: pnpm build:native-test
      - run: pnpm test:native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-runtime-evidence
          path: |
            target/native-tests/**/audits/*.json
            target/native-tests/**/logs/*.log
            target/native-tests/**/network-boundary.json
            target/startup-tests/**/result.json
          if-no-files-found: ignore
          retention-days: 7
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bundle-windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            jobs: '4'
          - name: bundle-linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            jobs: '4'
          - name: bundle-macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            jobs: '2'
          - name: bundle-macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            jobs: '2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
          cache-key: bundle-${{ matrix.target }}
      - name: Build unsigned test packages without release credentials
        shell: bash
        run: pnpm tauri build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
