name: Set up OpenRecall
description: Compatible pinned Node, pnpm and Rust with native desktop prerequisites
inputs:
  cache-key:
    description: Rust cache scope
    default: checks
  target:
    description: Optional Rust target
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.21.0'
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: '12.15.0'
        run_install: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: '1.99.0'
        components: rustfmt, clippy
        targets: ${{ inputs.target }}
    - name: Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - name: Install locked frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
