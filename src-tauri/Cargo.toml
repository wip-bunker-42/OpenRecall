[package]
name = "openrecall-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lib]
name = "openrecall_desktop_lib"
crate-type = ["rlib"]
[features]
automation = []
[build-dependencies]
tauri-build = {version = "=2.7.4", features = [] }
[dependencies]
openrecall-core = {path = "../crates/openrecall-core"}
tauri = {version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-updater = "=2.14.0"
chrono = "0.4"
serde = {version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tauri = { version = "=2.12.5", features = ["test"] }
